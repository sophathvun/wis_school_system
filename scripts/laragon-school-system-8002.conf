# Persistent Laragon site for the school's local URL.
server {
    listen 127.0.0.1:8002;
    server_name 127.0.0.1 localhost;
    root "C:/laragon/www/school_system/public";
    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass php_upstream;
    }

    location ~ /\. {
        deny all;
    }
}
